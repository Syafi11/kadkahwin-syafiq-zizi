<!-- 2. Kalendar (Sambungan) -->
            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Walimatulurus+Syafiq+%26+Zizi&location=Villa+Adina,+Titiwangsa,+Kuala+Lumpur" target="_blank" class="footer-item">
                <i class="fa-regular fa-calendar-days"></i>
                <span>Kalendar</span>

            <!-- 3. Lokasi -->
            <button class="footer-item" onclick="openModal('locationModal')">
                <i class="fa-solid fa-location-dot"></i>

            <button class="footer-item" onclick="openModal('contactModal')">

            <!-- 5. RSVP -->
            <button class="footer-item" onclick="openModal('rsvpModal')">
                <i class="fa-regular fa-envelope"></i>
                <span>RSVP</span>

        </div>

        <!-- MODAL 1: LOKASI -->
        <div class="modal" id="locationModal">
            <div class="modal-content">
                <h4>LOKASI MAJLIS</h4>
                <div class="modal-btns">
                    <a href="https://waze.com/ul?q=Villa+Adina+Titiwangsa" target="_blank" class="btn btn-waze">
                        <i class="fa-brands fa-waze"></i> Waze
                    </a>
                    <a href="https://maps.google.com/?q=Villa+Adina+Titiwangsa" target="_blank" class="btn btn-gmaps">
                        <i class="fa-solid fa-map-location-dot"></i> Google Maps
                    </a>
                </div>
                <button class="close-btn" onclick="closeModal('locationModal')">Tutup</button>
            </div>
        </div>

        <!-- MODAL 2: HUBUNGI -->
        <div class="modal" id="contactModal">
            <div class="modal-content">
                <h4>HUBUNGI KAMI</h4>
                <div class="modal-btns">
                    <a href="https://wa.me/60123456789?text=Hai,%20saya%20ingin%20bertanya%20mengenai%20majlis" target="_blank" class="btn btn-phone">
                        <i class="fa-brands fa-whatsapp"></i> Bapa Pengantin
                    </a>
                    <a href="https://wa.me/60198765432?text=Hai,%20saya%20ingin%20bertanya%20mengenai%20majlis" target="_blank" class="btn btn-phone">
                        <i class="fa-brands fa-whatsapp"></i> Ibu Pengantin
                    </a>
                </div>
                <button class="close-btn" onclick="closeModal('contactModal')">Tutup</button>
            </div>
        </div>

        <!-- MODAL 3: RSVP FORM -->
        <div class="modal" id="rsvpModal">
            <div class="modal-content">
                <div class="rsvp-section-modal">
                    <h3>PENGESAHAN KEHADIRAN</h3>
                    <div class="divider-ornament">❖ ❖ ❖</div>
                    <form id="rsvpForm" onsubmit="handleRSVPSubmit(event)">
                        <div class="form-group">
                            <label for="nama">Nama Lengkap</label>
                            <input type="text" id="nama" class="form-input" placeholder="Masukkan nama anda" required>
                        </div>
                        <div class="form-group">
                            <label for="kehadiran">Kehadiran</label>
                            <select id="kehadiran" class="form-input" onchange="toggleJumlahPax()" required>
                                <option value="Hadir">Hadir</option>
                                <option value="Tidak Hadir">Tidak Hadir</option>
                            </select>
                        </div>
                        <div class="form-group" id="paxGroup">
                            <label for="pax">Jumlah Pax (Termasuk Anda)</label>
                            <input type="number" id="pax" class="form-input" min="1" max="10" value="1">
                        </div>
                        <button type="submit" class="submit-rsvp-btn">HANTAR RSVP</button>
                    </form>
                </div>
                <button class="close-btn" onclick="closeModal('rsvpModal')">Tutup</button>
            </div>
        </div>

    </div>

    <!-- Audio Background (Gantikan song.mp3 dengan fail audio anda) -->
    <audio id="weddingAudio" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        let isAudioPlaying = false;
        const audio = document.getElementById('weddingAudio');
        const musicIcon = document.getElementById('musicIcon');

        // Buka Kad Sampul
        function openCard() {
            document.getElementById('envelope').classList.add('open');
            // Play lagu secara automatik apabila kad dibuka (jika dibenarkan pelayar)
            playAudio();
        }

        // Kawalan Audio (Play/Pause)
        function toggleAudio() {
            if (isAudioPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            audio.play().then(() => {
                isAudioPlaying = true;
                musicIcon.className = "fa-solid fa-circle-pause";
            }).catch(error => {
                console.log("Autoplay dihalang oleh pelayar:", error);
            });
        }

        function pauseAudio() {
            audio.pause();
            isAudioPlaying = false;
            musicIcon.className = "fa-solid fa-circle-play";
        }

        // Kawalan Modal Pop-up
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Tunjuk / Sembunyi Medan Pax Mengikut Pilihan Kehadiran
        function toggleJumlahPax() {
            const status = document.getElementById('kehadiran').value;
            const paxGroup = document.getElementById('paxGroup');
            if (status === 'Tidak Hadir') {
                paxGroup.style.display = 'none';
            } else {
                paxGroup.style.display = 'block';
            }
        }

        // Simpan & Kemaskini Kaunter Kehadiran (Local Data)
        let totalHadir = 0;
        let totalTakHadir = 0;

        function handleRSVPSubmit(event) {
            event.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const status = document.getElementById('kehadiran').value;
            const pax = parseInt(document.getElementById('pax').value) || 1;

            if (status === 'Hadir') {
                totalHadir += pax;
                document.getElementById('countHadir').innerText = totalHadir;
            } else {
                totalTakHadir += 1;
                document.getElementById('countTakHadir').innerText = totalTakHadir;
            }

            alert(`Terima kasih ${nama}! Maklum balas RSVP anda telah diterima.`);
            
            // Reset borang dan tutup modal
            document.getElementById('rsvpForm').reset();
            toggleJumlahPax();
            closeModal('rsvpModal');
        }
    </script>
</body>
</html>
