<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kad Undangan & RSVP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f4ef;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #eae2d6;
        }

        .card h1 {
            font-size: 24px;
            color: #4a3e3d;
            margin-bottom: 8px;
        }

        .card p.subtitle {
            font-size: 14px;
            color: #7a6e6d;
            margin-bottom: 20px;
        }

        .counter-badge {
            background-color: #f0e6d2;
            color: #5a4a3a;
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a3e3d;
        }

        .form-group select, 
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcd3c5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group select:focus, 
        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #8c7355;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #8c7355;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #705b42;
        }

        .btn-submit:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success { background-color: #e6f4ea; color: #137333; }
        .alert-error { background-color: #fce8e6; color: #c5221f; }
    </style>
</head>
<body>

<div class="card">
    <h1>Pengesahan Kehadiran</h1>
    <p class="subtitle">Sila lengkapkan borang di bawah untuk RSVP</p>

    <!-- Kaunter Jumlah Pax -->
    <div class="counter-badge">
        Jumlah Kehadiran Semasa: <span id="paxCount">0</span> Pax
    </div>

    <!-- Mesej Status -->
    <div id="alertBox" class="alert"></div>

    <form id="rsvpForm" onsubmit="submitRSVP(event)">
        <div class="form-group">
            <label for="inputStatus">Kehadiran</label>
            <select id="inputStatus" onchange="togglePaxField(this.value)" required>
                <option value="Hadir">Hadir</option>
                <option value="Tidak Hadir">Tidak Hadir</option>
            </select>
        </div>

        <div class="form-group" id="paxGroup">
            <label for="inputPax">Jumlah Pax (Termasuk Diri Anda)</label>
            <input type="number" id="inputPax" min="1" value="1" required>
        </div>

        <div class="form-group">
            <label for="inputUcapan">Ucapan / Doa</label>
            <textarea id="inputUcapan" rows="3" placeholder="Titipkan ucapan untuk kami..."></textarea>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">Hantar RSVP</button>
    </form>
</div>

<script>
    // GANTIKAN URL DI BAWAH DENGAN WEB APP URL DARI GOOGLE APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbxXXXXXXXXXXXXXXX/exec";

    // Ambil jumlah pax sebaik sahaja web dimuatkan
    document.addEventListener('DOMContentLoaded', fetchRSVPCount);

    function togglePaxField(status) {
        const paxGroup = document.getElementById('paxGroup');
        const inputPax = document.getElementById('inputPax');
        
        if (status === 'Hadir') {
            paxGroup.classList.remove('hidden');
            inputPax.required = true;
        } else {
            paxGroup.classList.add('hidden');
            inputPax.required = false;
        }
    }

    function fetchRSVPCount() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                if (data.totalPax !== undefined) {
                    document.getElementById('paxCount').innerText = data.totalPax;
                }
            })
            .catch(err => console.error("Ralat mengambil jumlah pax:", err));
    }

    function submitRSVP(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('btnSubmit');
        const alertBox = document.getElementById('alertBox');
        
        submitBtn.innerText = "Menghantar...";
        submitBtn.disabled = true;

        const statusVal = document.getElementById('inputStatus').value;
        const paxVal = statusVal === 'Hadir' ? document.getElementById('inputPax').value : 0;
        const ucapanVal = document.getElementById('inputUcapan').value;

        // Guna URLSearchParams untuk melepasi sekatan CORS Apps Script
        const formData = new URLSearchParams();
        formData.append('status', statusVal);
        formData.append('pax', paxVal);
        formData.append('ucapan', ucapanVal);

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        })
        .then(() => {
            alertBox.className = "alert alert-success";
            alertBox.innerText = "Terima kasih! Pengesahan RSVP anda telah berjaya dihantar.";
            alertBox.style.display = "block";

            // Reset borang
            document.getElementById('rsvpForm').reset();
            togglePaxField('Hadir');

            // Kemaskini jumlah counter selepas delay 2 saat
            setTimeout(fetchRSVPCount, 2000);
        })
        .catch(err => {
            console.error("Ralat:", err);
            alertBox.className = "alert alert-error";
            alertBox.innerText = "Maaf, berlaku ralat. Sila cuba lagi.";
            alertBox.style.display = "block";
        })
        .finally(() => {
            submitBtn.innerText = "Hantar RSVP";
            submitBtn.disabled = false;
        });
    }
</script>

</body>
</html>
